[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calendoro"
version = "0.1.0"
description = "Python client for the Calendoro scheduling API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Typing :: Typed"]

[project.urls]
Repository = "https://github.com/Calendoro/calendoro-python"

[tool.hatch.build.targets.wheel]
packages = ["src/calendoro"]
